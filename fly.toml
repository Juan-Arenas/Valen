app = "valen-makeup"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  DATABASE_URL = "${DATABASE_URL}"
  ADMIN_PASSWORD = "${ADMIN_PASSWORD}"

[[services]]
  internal_port = 5000
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
