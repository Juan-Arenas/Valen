version: '3.8'

services:
  web:
    build: .
    ports:
      - '5000:5000'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HOST=0.0.0.0
      - PORT=5000
      - FLASK_DEBUG=false
    command: gunicorn backend:app --bind 0.0.0.0:5000
    volumes:
      - .:/app:cached
