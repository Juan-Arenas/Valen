version: '3.8'

services:
  web:
    build: .
    ports:
      - '5000:5000'
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - AUTHORIZED_USERS=${AUTHORIZED_USERS}
      - DATABASE_URL=${DATABASE_URL}
      - HOST=0.0.0.0
      - PORT=5000
      - FLASK_DEBUG=false
    command: gunicorn backend:app --bind 0.0.0.0:5000
    volumes:
      - .:/app:cached

  bot:
    build: .
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - AUTHORIZED_USERS=${AUTHORIZED_USERS}
      - DATABASE_URL=${DATABASE_URL}
    command: python telegram_bot.py
    depends_on:
      - web
    volumes:
      - .:/app:cached
